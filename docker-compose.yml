services:
  deck-box-engraver:
    build: .
    image: deck-box-engraver
    container_name: deck-box-engraver   # Nginx Proxy Manager forwards to this name (port 80)
    restart: unless-stopped
    networks:
      - npm-network

networks:
  npm-network:
    external: true   # the existing Nginx Proxy Manager network; compose joins it on every up, never creates it
